services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ailist
      POSTGRES_USER: ailist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailist -d ailist"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://ailist:${POSTGRES_PASSWORD}@db:5432/ailist?sslmode=disable
      APP_TOKEN: ${APP_TOKEN:?set APP_TOKEN in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8081/v1}
      LLM_MODEL: ${LLM_MODEL:-local}
      LLM_API_KEY: ${LLM_API_KEY:-}
      WHISPER_URL: ${WHISPER_URL:-http://whisper:8000/transcribe}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_USERS: ${TELEGRAM_USERS:-}
      BOT_LANG: ${BOT_LANG:-ru}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 4s
      retries: 15
  whisper:
    profiles: ["voice"]
    build: whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_THREADS: ${WHISPER_THREADS:-2}
    volumes:
      - models:/models
volumes:
  database:
  models:
